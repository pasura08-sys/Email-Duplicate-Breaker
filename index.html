<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Duplicate Checker</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: burlywood;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 450px;
        padding: 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(14px);
        box-shadow: 0 20px 45px rgba(0,0,0,0.35);
        animation: fadeIn 0.8s ease-out;
        color: white;
        border: 2px solid rgba(255,255,255,0.4);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(25px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    input {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-size: 16px;
        margin-bottom: 15px;
        background: rgba(255,255,255,0.9);
        color: #333;
    }

    button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-size: 17px;
        cursor: pointer;
        background: linear-gradient(135deg, #00f260, #0575e6);
        color: white;
        font-weight: 600;
        transition: 0.3s;
        box-shadow: 0 10px 25px rgba(5, 117, 230, 0.5);
    }

    button:hover {
        transform: scale(1.07);
        box-shadow: 0 15px 35px rgba(5, 117, 230, 0.7);
    }

    .result-box {
        margin-top: 25px;
        padding: 18px;
        border-radius: 15px;
        background: rgba(255,255,255,0.95);
        color: #333;
        display: none;
        animation: slideUp 0.5s ease-out;
        border-left: 6px solid transparent;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .success {
        border-left-color: #28a745;
    }

    .error {
        border-left-color: #dc3545;
    }

    .badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 10px;
        font-weight: 600;
        color: white;
    }

    .badge-success {
        background: #28a745;
    }

    .badge-error {
        background: #dc3545;
    }
</style>

</head>

<body>

<div class="card">
    <h2>Email Duplicate Checker</h2>

    <input id="email" placeholder="Enter email address">

    <button onclick="checkEmail()">Check Email</button>

    <div id="result" class="result-box"></div>
</div>

<script>
async function checkEmail() {
    const email = document.getElementById("email").value.trim();
    const resultBox = document.getElementById("result");

    if (!email) {
        resultBox.style.display = "block";
        resultBox.className = "result-box error";
        resultBox.innerHTML = `
            <span class="badge badge-error">Error</span><br>
            Please enter an email.
        `;
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:5000/check-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        const isDuplicate = data.exists_in_list;

        resultBox.style.display = "block";
        resultBox.className = "result-box " + (isDuplicate ? "error" : "success");

        resultBox.innerHTML = `
            <span class="badge ${isDuplicate ? "badge-error" : "badge-success"}">
                ${isDuplicate ? "Duplicate Found" : "No Duplicate"}
            </span><br>

            <b>Email:</b> ${data.email}<br>
            <b>Exists in List:</b> ${data.exists_in_list}<br>
            <b>Exists in Set:</b> ${data.exists_in_set}<br><br>

            <b>List Lookup Time:</b> ${data.list_time_microseconds.toFixed(3)} µs<br>
            <b>Set Lookup Time:</b> ${data.set_time_microseconds.toFixed(3)} µs<br><br>

            <b>Why Sets Are Faster:</b><br>
            ${data.explanation}
        `;
    } catch (err) {
        resultBox.style.display = "block";
        resultBox.className = "result-box error";
        resultBox.innerHTML = `
            <span class="badge badge-error">Connection Error</span><br>
            Unable to reach the server.
        `;
    }
}
</script>

</body>
</html>
