<!DOCTYPE html>
<html>
<head>
    <title>Email Duplicate Checker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="card">
    <h2>Email Duplicate Checker</h2>

    <input id="email"
           placeholder="Enter email address">

    <button onclick="checkEmail()">
        Check Email
    </button>

    <div id="result"></div>
</div>
</body>
<script>
async function checkEmail() {

    const email = document.getElementById("email").value;

    const response = await fetch(
        "http://127.0.0.1:5000/check-email",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                email: email
            })
        }
    );

    const data = await response.json();

    document.getElementById("result").innerHTML =
`
Email: ${data.email}<br>
Exists in List: ${data.exists_in_list}<br>
Exists in Set: ${data.exists_in_set}<br>
List Time: ${data.list_time_microseconds}<br>
Set Time: ${data.set_time_microseconds}
`;
try {

   const response = await fetch(
      "http://127.0.0.1:5000/check-email",
      {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({email})
      }
   );

   const data = await response.json();

}
catch(error){
    document.getElementById("result").innerHTML =
    "Unable to connect to server";
}
}
</script>
</html>
